name: Generate GitHub Stats Images

on:
  schedule:
    # Runs every 12 hours — adjust the cron if you want it fresher/less frequent
    - cron: "0 */12 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate stats images
        uses: jstrieb/github-stats@master
        with:
          username: shahdanish1092
          github_token: ${{ secrets.ACCESS_TOKEN }}
          # Optional tuning:
          # exclude_repos: repo-to-skip,another-repo
          # exclude_langs: HTML,CSS